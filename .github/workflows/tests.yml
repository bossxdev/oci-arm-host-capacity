name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['8.3']
    name: unit-tests (PHP ${{ matrix.php-versions }})
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: curl, pdo_sqlite, sqlite3

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php-versions }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit suite (live OCI tests self-skip)
        run: vendor/bin/phpunit --no-coverage

      - name: Run standalone smoke scripts (no OCI calls)
        run: |
          php -d zend.assertions=1 -d assert.exception=1 tests/preflight-smoke.php
          php -d zend.assertions=1 -d assert.exception=1 tests/inventory-smoke.php
          php -d zend.assertions=1 -d assert.exception=1 tests/launch-state-smoke.php
          php -d zend.assertions=1 -d assert.exception=1 tests/monitor-smoke.php
          php -d zend.assertions=1 -d assert.exception=1 tests/rate-limit-smoke.php
